name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Unsigned App
        run: |
          mkdir -p dependencies/ios && touch dependencies/ios/Data.rsdk
          ln -sfn RSDKv3 SonicCDDecomp
          touch RSDKv3/Video.cpp
          echo "" > dependencies/mac/cocoaHelpers.mm
          if [ -d "dependencies/all/tinyxml2" ]; then
            ln -sfn all/tinyxml2 dependencies/tinyxml2
          fi
          set -o pipefail
          xcodebuild -project "RSDKv3 ios.xcodeproj" \
            -scheme "RSDKv3" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) RETRO_PLATFORM=RETRO_iOS RETRO_USING_SDL2=1 RETRO_MOD_LOADER=1 RETRO_USE_MOD_LOADER=1' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" -A 3

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          rm -f Payload/*.app/Data.rsdk
          zip -r RSDKv3-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv3-iOS
          path: RSDKv3-iOS.ipa
